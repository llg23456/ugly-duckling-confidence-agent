name: ugly-duckling-cloudtest
services:
  api:
    image: ugly-duckling-cloudtest:${APP_VERSION:-20261113-01}
    build:
      context: ../..
      dockerfile: deploy/cloud-test/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      APP_ENV: production
      CLOUD_AUTH_REQUIRED: "true"
      CLOUD_DAILY_REQUESTS: "0"
      CLOUD_GLOBAL_DAILY_REQUESTS: "0"
      DATABASE_URL: sqlite:////data/confidence_agent.db
      FFMPEG_PATH: /usr/bin/ffmpeg
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /opt/ugly-duckling-cloudtest/data:/data
      - /opt/ugly-duckling-cloudtest/backups:/backups
    mem_limit: 2560m
    cpus: 1.5
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 8s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
