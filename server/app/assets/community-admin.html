<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸭力Go 社区管理</title>
<style>body{font:16px system-ui;background:#f7f6f0;color:#263b2c;max-width:1100px;margin:24px auto;padding:20px}input,textarea,button,select{font:inherit;padding:10px;margin:5px;border:1px solid #bbc6bc;border-radius:8px}button{cursor:pointer;background:#e7eee6}article{background:white;padding:20px;margin:15px 0;border-radius:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere}img{max-width:260px;max-height:220px;margin:8px}#status{color:#96452e}</style>
<h1>鸭力Go 社区管理</h1><p>仅供授权管理员通过 SSH 隧道访问。处理结果会影响受邀用户看到的内容。</p>
<form id="login"><input name="username" autocomplete="username" placeholder="管理员账号" required><input name="password" type="password" autocomplete="current-password" placeholder="密码" required><button>登录</button></form>
<section id="main" hidden><select id="kind"><option value="reports">举报队列</option><option value="posts">帖子与图片</option><option value="comments">评论</option><option value="profiles">社区用户</option><option value="audit">操作记录</option></select><button id="refresh">刷新</button><button id="prev">上一页</button><button id="next">下一页</button><button id="logout">退出</button><div id="items"></div></section><p id="status"></p>
<script>
let csrf='',page=0,hasMore=false;const $=x=>document.getElementById(x);
async function api(path,method='GET',body){let r=await fetch('/community-admin/'+path,{method,headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:body?JSON.stringify(body):undefined});let d=await r.json();if(r.status===401){$('login').hidden=false;$('main').hidden=true}if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:'请求失败');return d}
function status(text){$('status').textContent=text}
function button(parent,label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=()=>fn().catch(e=>status(e.message));parent.append(b)}
async function act(kind,id,action){let reason=prompt('请输入处理原因或备注（必填，最多300字）');if(!reason)return;await api('action','POST',{kind,target_id:id,action,reason});status('已保存处理结果');await load()}
async function load(){try{let d=await api('items?kind='+$('kind').value+'&page='+page);hasMore=d.has_more;$('items').replaceChildren();$('prev').disabled=page===0;$('next').disabled=!hasMore;for(let row of d.items){let card=document.createElement('article');let text=document.createElement('pre');text.textContent=JSON.stringify(row,null,2);card.append(text);let kind=$('kind').value;if(kind==='posts'){for(let id of row.media_ids||[]){let img=document.createElement('img');img.src='/community-admin/media/'+encodeURIComponent(id);card.append(img)}if(row.status!=='deleted'){button(card,'下架',()=>act('post',row.id,'hide'));button(card,'恢复',()=>act('post',row.id,'restore'))}}if(kind==='comments'&&row.status!=='deleted'){button(card,'下架',()=>act('comment',row.id,'hide'));button(card,'恢复',()=>act('comment',row.id,'restore'))}if(kind==='reports'){button(card,'查看被举报内容',async()=>{let target=await api('target/'+row.kind+'/'+encodeURIComponent(row.target_id));let detail=document.createElement('pre');detail.textContent=JSON.stringify(target,null,2);card.append(detail);for(let id of target.media_ids||[]){let img=document.createElement('img');img.src='/community-admin/media/'+encodeURIComponent(id);card.append(img)}if(target.status!=='deleted'){button(card,'下架此内容',()=>act(row.kind,row.target_id,'hide'));button(card,'恢复此内容',()=>act(row.kind,row.target_id,'restore'))}button(card,'限制此作者发布',()=>act('profile',target.author_id,'restrict'))});button(card,'标记已处理',()=>act('report',row.id,'resolve'))};if(kind==='profiles'){button(card,row.restricted?'解除发布限制':'限制社区发布',()=>act('profile',row.id,row.restricted?'unrestrict':'restrict'))}$('items').append(card)}if(!d.items.length)$('items').textContent='暂无记录'}catch(e){status(e.message)}}
$('login').onsubmit=async e=>{e.preventDefault();try{let form=new FormData(e.target);let d=await api('login','POST',{username:form.get('username'),password:form.get('password')});csrf=d.csrf;e.target.reset();$('login').hidden=true;$('main').hidden=false;status('已登录：'+d.username);await load()}catch(e){status(e.message)}};
$('logout').onclick=async()=>{try{await api('logout','POST');location.reload()}catch(e){status(e.message)}};
$('refresh').onclick=()=>load();$('kind').onchange=()=>{page=0;load()};$('prev').onclick=()=>{if(page){page--;load()}};$('next').onclick=()=>{if(hasMore){page++;load()}};
api('session').then(d=>{csrf=d.csrf;$('login').hidden=true;$('main').hidden=false;load()}).catch(()=>{});
</script></html>
